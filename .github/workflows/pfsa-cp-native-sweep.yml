name: PFSA native LSmash larger random projectors

on:
  push:
    branches: [pfsa-changepoint-lsmash-projections]
    paths: [".github/workflows/pfsa-cp-native-sweep.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pfsa-changepoint-lsmash-projections
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install C++ and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgsl-dev libboost-all-dev g++
          python -m pip install "numpy==2.3.5" "scipy==1.17.0" "numba==0.65.1" pybind11
      - name: Compile upstream LSmash with randomized native PFSA support
        run: |
          git clone --depth 1 https://github.com/zeroknowledgediscovery/lsmash.git /tmp/lsmash
          python pfsa_cp_lsmash/patch_native.py /tmp/lsmash/src/pybind_module.cpp
          python -m pip install /tmp/lsmash
      - name: Run 32-state 32-projection scan
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "2"
        run: |
          python pfsa_cp_lsmash/sweep_native.py
      - name: Commit extended results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pfsa_cp_lsmash/results_native_32state.json
          if ! git diff --cached --quiet; then
            git commit -m "Record extended native LSmash random PFSA sweep [skip ci]"
            git push origin HEAD:pfsa-changepoint-lsmash-projections
          fi
