name: PFSA change-point native random LSmash projections

on:
  push:
    branches: [pfsa-changepoint-lsmash-projections]
    paths:
      - ".github/workflows/pfsa-cp-native-projections.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pfsa-changepoint-lsmash-projections
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native toolchain and science Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgsl-dev libboost-all-dev g++
          python -m pip install "numpy==2.3.5" "scipy==1.17.0" "numba==0.65.1" pybind11
      - name: Build actual compiled LSmash with random PFSA projectors exposed
        run: |
          git clone --depth 1 https://github.com/zeroknowledgediscovery/lsmash.git /tmp/native-lsmash
          python pfsa_cp_lsmash/patch_native.py /tmp/native-lsmash/src/pybind_module.cpp
          python -m pip install /tmp/native-lsmash
          python -c "import lsmash; assert hasattr(lsmash._lsmash,'from_sequences_random_projectors')"
      - name: Run native random-projection experiment
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "2"
          NUMBA_NUM_THREADS: "2"
        run: python pfsa_cp_lsmash/experiment_native.py
      - name: Store numerical results in experimental branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pfsa_cp_lsmash/results_native.json
          if ! git diff --cached --quiet; then
            git commit -m "Record change-point native random LSmash results [skip ci]"
            git push origin HEAD:pfsa-changepoint-lsmash-projections
          fi
