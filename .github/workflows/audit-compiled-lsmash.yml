name: Audit compiled LSmash against stochastic nullspace

on:
  workflow_dispatch:
  push:
    branches:
      - stochastic-interference-48-honeydew
    paths:
      - ".github/workflows/audit-compiled-lsmash.yml"

permissions:
  contents: write

jobs:
  compiled-lsmash:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stochastic-interference-48-honeydew
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgsl-dev libboost-all-dev g++ 
          python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Build the real C++ LSmash extension
        run: |
          python -m pip install --verbose "lsmash @ git+https://github.com/zeroknowledgediscovery/lsmash.git"
          python -c "import lsmash; print('Compiled LSmash available:', lsmash)"
      - name: Run full-recording differential-distance baseline
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "1"
          LSMASH_N: "130000"
        run: python stochastic_interference_48/private/test_compiled_lsmash.py
      - name: Commit test results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stochastic_interference_48/compiled_lsmash_result.json
          if ! git diff --cached --quiet; then
            git commit -m "Record real compiled LSmash nullspace baseline [skip ci]"
            git push origin HEAD:stochastic-interference-48-honeydew
          fi
